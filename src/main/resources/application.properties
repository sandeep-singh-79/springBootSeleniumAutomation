spring.profiles.active=dev
spring.profiles.default=dev
application.url=https://www.google.com
screenshot.path=src/main/screenshots/
browser=chrome
app.locale=es

# Selenium WebDriver configuration
element.wait.timeout=30
element.wait.poll.interval=500

# API Testing configuration
api.base.url=https://api.example.com
api.log.request=true
api.log.response=true
api.auth.token=
api.connection.timeout=10000
api.read.timeout=30000
api.retry.max=1
api.retry.delay=1000

# Test data configuration
test.data.excel.path=data/testdata.xlsx
test.data.json.path=data/testdata.json

# Docker configuration
docker.selenium.hub=http://localhost:4444/wd/hub
docker.enabled=false

spring.jpa.defer-datasource-initialization=true

# Logging configuration
logging.level.root=INFO
logging.file.name=test-execution.log
logging.file.max-size=1MB
logging.level.com.ssandeep79.springseleniumdemo=INFO
logging.level.io.restassured=INFO
