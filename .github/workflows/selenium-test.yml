name: Selenium Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'TestNG suite to run'
        required: false
        default: 'testng-suite.xml'
      environment:
        description: 'Environment to run tests against'
        required: false
        default: 'qa'
        type: choice
        options:
          - qa
          - stg

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      selenium-hub:
        image: selenium/hub:latest
        ports:
          - "4444:4444"
      
      chrome:
        image: selenium/node-chrome:latest
        env:
          SE_EVENT_BUS_HOST: selenium-hub
          SE_EVENT_BUS_PUBLISH_PORT: 4442
          SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
          SE_NODE_MAX_SESSIONS: 5
        volumes:
          - /dev/shm:/dev/shm
      
      firefox:
        image: selenium/node-firefox:latest
        env:
          SE_EVENT_BUS_HOST: selenium-hub
          SE_EVENT_BUS_PUBLISH_PORT: 4442
          SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
          SE_NODE_MAX_SESSIONS: 5
        volumes:
          - /dev/shm:/dev/shm
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: Build with Maven
        run: mvn clean compile -DskipTests
      
      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            mvn test -Dspring.profiles.active=remote -Dspring.profiles.active=${{ github.event.inputs.environment }} -DsuiteXmlFile=${{ github.event.inputs.test_suite }}
          else
            mvn test -Dspring.profiles.active=remote
          fi
      
      - name: Generate Allure report
        if: always()
        run: mvn allure:report
      
      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/allure-maven-plugin/
      
      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v3
        with:
          report_paths: 'target/surefire-reports/TEST-*.xml'
          github_token: ${{ secrets.GITHUB_TOKEN }}
